name: Marketplace Scraper Bot

on:
  schedule:
    # Runs every hour at minute 0
    - cron: '* */6 * * *'
  workflow_dispatch:

permissions:
  contents: write  # Gives the bot permission to push changes to your repo

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Scraper Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python scraper.py

      - name: Commit and Push Updated Seen Listings
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add seen_listings.json || true
          git commit -m "chore: update seen listings database [skip ci]" || exit 0
          git push
